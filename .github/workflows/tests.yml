name: Afruz PXRD tests

on:
  push:
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev-lock.txt
      - name: Install locked development environment
        run: python -m pip install --disable-pip-version-check -r requirements-dev-lock.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Run unit, integration, GUI, and numerical-regression tests
        run: python -m pytest --cov=afruz_pxrd --cov-report=term-missing --cov-report=xml:test_artifacts/coverage.xml
